<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavandus - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #006064;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00838f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #006064;
        }
        #mensajeError {
            color: red;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        #mensajeExito {
            color: green;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Lavandus S.R.L.</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Correo Electrónico:</label>
                <input type="email" id="usuario" placeholder="ejemplo@lavandus.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit">Ingresar al Sistema</button>
            <div id="mensajeError">Credenciales inválidas. Intente de nuevo.</div>
            <div id="mensajeExito">¡Login exitoso! Redirigiendo...</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            
            const errorDiv = document.getElementById('mensajeError');
            const exitoDiv = document.getElementById('mensajeExito');

            
            if (usuario === 'admin@lavandus.com' && password === '1234') {
                errorDiv.style.display = 'none';
                exitoDiv.style.display = 'block';
                
                /
                setTimeout(() => {
                    alert('¡Bienvenido a Lavandus! (Simulación de ingreso a la pantalla de Pedidos)');
                    // Acá a futuro iría: window.location.href = 'pedidos.html';
                }, 1500);

            } else {
                exitoDiv.style.display = 'none';
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
